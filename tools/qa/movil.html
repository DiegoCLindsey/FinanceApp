<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>QA · ancho de móvil</title>
<!-- Chromium sin cabecera no baja de 500 px de viewport con --window-size, así
     que para medir un ancho de móvil DE VERDAD hay que meter la aplicación en un
     iframe del ancho deseado: un iframe sí crea su propio viewport. Esta página
     lo hace y saca fuera el informe que el piloto deja dentro. -->
<style>
  html,body{margin:0;background:#111}
  iframe{width:390px;height:900px;border:0;position:absolute;left:-9999px}
  pre{color:#0f0;background:#000;font:11px/1.35 monospace;padding:10px;white-space:pre-wrap;margin:0}
</style></head>
<body>
<iframe id="f" src="../../qa.html"></iframe>
<pre id="out">esperando…</pre>
<script>
  var f = document.getElementById('f'), out = document.getElementById('out');
  var t = setInterval(function () {
    try {
      var w = f.contentWindow;
      if (w.__qa && w.__qa.listo) {
        clearInterval(t);
        out.textContent = w.document.getElementById('qa-out').textContent;
      }
    } catch (e) { clearInterval(t); out.textContent = 'error: ' + e.message; }
  }, 500);
</script>
</body></html>
